<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <!-- Yeşil K Harfi (Arkada) -->
  <g fill="#7DF0A8">
    <rect x="230" y="100" width="60" height="300" />
    <polygon points="290,250 370,100 430,100 330,250" />
    <polygon points="290,250 330,250 430,400 370,400" />
  </g>

  <!-- Siyah B Harfi (Önde) ve Aradaki Şeffaf Boşluk -->
  <!-- stroke="#F2F6F3" kodu, sitenizin arka plan rengiyle aynıdır, böylece aradaki boşluk kusursuz görünür -->
  <g fill="#000000" stroke="#F2F6F3" stroke-width="12" stroke-linejoin="round">
    <!-- B'nin Dikey Gövdesi ve Sol Üst Kesimi -->
    <path d="M 100 160 L 160 100 L 160 400 L 100 400 Z" />
    <!-- B'nin Üst Kısmı -->
    <path d="M 160 100 L 200 100 C 270 100 270 250 200 250 L 160 250 Z" />
    <!-- B'nin Alt Kısmı -->
    <path d="M 160 250 L 220 250 C 290 250 290 400 220 400 L 160 400 Z" />
  </g>
</svg>
